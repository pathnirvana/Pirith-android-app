apply plugin: 'com.android.application'

android {
    compileSdkVersion 36
    defaultConfig {
        applicationId "lk.pitaka.pirith"
        minSdkVersion 21
        targetSdkVersion 36
        versionCode 21
        versionName "3.0"
        testInstrumentationRunner 'androidx.test.runner.AndroidJUnitRunner'
    }
    // release signing as in the other pitaka.lk apps: the key's alias and passwords come from ~/.gradle/gradle.properties
    signingConfigs {
        release {
            storeFile file('/Volumes/2TB/Android/pitaka.lk.jks')
            keyAlias findProperty('TIPITAKA_KEY_ALIAS') ?: ''
            storePassword findProperty('TIPITAKA_STORE_PASSWORD') ?: ''
            keyPassword findProperty('TIPITAKA_KEY_PASSWORD') ?: findProperty('TIPITAKA_STORE_PASSWORD') ?: ''
        }
    }
    buildTypes {
        release {
            if (findProperty('TIPITAKA_STORE_PASSWORD')) signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
    namespace 'lk.pitaka.pirith'
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
    implementation 'androidx.appcompat:appcompat:1.7.1'
    implementation 'androidx.constraintlayout:constraintlayout:2.2.1'
    implementation 'androidx.media3:media3-exoplayer:1.5.1'
    implementation 'androidx.media3:media3-session:1.5.1'
    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.3.0'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.7.0'
}